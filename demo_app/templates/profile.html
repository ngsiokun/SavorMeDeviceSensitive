<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SavorMe - Your Profile</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/profile.css">
</head>
<body>
    <div class="app-container">
        <div class="phone-mockup">
            <!-- Status Bar -->
            <div class="status-bar">
                <span>9:41</span>
                <span>🔋 100%</span>
            </div>
            
            <!-- Main Content -->
            <div class="content-area">
                <!-- Header -->
                <div class="header">
                    <h1 class="title">Tell us about yourself</h1>
                    <p class="subtitle">Personalize your nutrition recommendations</p>
                </div>
                
                <!-- Profile Form -->
                <form id="profileForm" onsubmit="saveProfile(event)">
                    <!-- Basic Info Section -->
                    <div class="form-section">
                        <div class="section-title">📋 Basic Information</div>
                        
                        <div class="form-group">
                            <label>Age</label>
                            <input type="number" id="age" name="age" value="32" min="1" max="120" required>
                        </div>
                        
                        <div class="form-group">
                            <label>Gender</label>
                            <select id="gender" name="gender" required>
                                <option value="female" selected>Female</option>
                                <option value="male">Male</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label>Height (cm)</label>
                                <input type="number" id="height_cm" name="height_cm" value="165" min="100" max="250" required>
                            </div>
                            
                            <div class="form-group">
                                <label>Weight (kg)</label>
                                <input type="number" id="weight_kg" name="weight_kg" value="60" min="30" max="300" required>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Preferences Section -->
                    <div class="form-section">
                        <div class="section-title">🍽️ Food Preferences</div>
                        
                        <div class="form-group">
                            <label>Dietary Preference</label>
                            <select id="dietary_preference" name="dietary_preference">
                                <option value="none" selected>None</option>
                                <option value="vegetarian">Vegetarian</option>
                                <option value="vegan">Vegan</option>
                                <option value="pescatarian">Pescatarian</option>
                                <option value="gluten_free">Gluten Free</option>
                                <option value="dairy_free">Dairy Free</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Preferred Cuisine (select one)</label>
                            <select id="cuisine" name="cuisine" required>
                                <option value="Mediterranean" selected>🫒 Mediterranean</option>
                                <option value="Italian">🍝 Italian</option>
                                <option value="Asian">🍜 Asian</option>
                                <option value="Chinese">🥢 Chinese</option>
                                <option value="Mexican">🌮 Mexican</option>
                                <option value="Surprise Me">🎲 Surprise Me</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Food Allergies (optional)</label>
                            <input type="text" id="allergies" name="allergies" placeholder="e.g., peanuts, shellfish">
                            <div class="helper-text">Separate multiple allergies with commas</div>
                        </div>
                    </div>
                    
                    <!-- Submit Button -->
                    <button type="submit" class="continue-btn">
                        Continue to Mood Selection →
                    </button>
                    
                    <div class="version-badge">v2.0 • Evidence-Based System</div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="/static/js/profile.js"></script>
</body>
</html>
