<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SavorMe - Your Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">
</head>
<body>
    <div class="app-container">
        <div class="phone-mockup">
            <!-- Status Bar -->
            <div class="status-bar">
                <span>9:41</span>
                <span>🔋 100%</span>
            </div>
            
            <!-- Main Content -->
            <div class="content-area">
                <!-- Header -->
                <div class="header">
                    <h1 class="title">Tell us about yourself</h1>
                    <p class="subtitle">Personalize your nutrition recommendations</p>
                </div>
                
                <!-- Profile Form -->
                <form id="profileForm" onsubmit="saveProfile(event)">
                    <!-- Basic Info Section -->
                    <div class="form-section compact-section">
                        <div class="section-title">📋 Basic Info</div>
                        
                        <div class="form-row">
                            <div class="form-group compact">
                                <label>Age</label>
                                <input type="number" id="age" name="age" value="32" min="1" max="120" required>
                            </div>
                            
                            <div class="form-group compact">
                                <label>Gender</label>
                                <select id="gender" name="gender" required>
                                    <option value="female" selected>Female</option>
                                    <option value="male">Male</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group compact">
                                <label>Height (cm)</label>
                                <input type="number" id="height_cm" name="height_cm" value="165" min="100" max="250" required>
                            </div>
                            
                            <div class="form-group compact">
                                <label>Weight (kg)</label>
                                <input type="number" id="weight_kg" name="weight_kg" value="60" min="30" max="300" required>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Preferences Section -->
                    <div class="form-section compact-section">
                        <div class="section-title">🍽️ Food Preferences</div>
                        
                        <div class="form-row">
                            <div class="form-group compact">
                                <label>Diet</label>
                                <select id="dietary_preference" name="dietary_preference">
                                    <option value="none" selected>None</option>
                                    <option value="vegetarian">Vegetarian</option>
                                    <option value="vegan">Vegan</option>
                                    <option value="pescatarian">Pescatarian</option>
                                    <option value="gluten_free">Gluten Free</option>
                                    <option value="dairy_free">Dairy Free</option>
                                </select>
                            </div>
                            
                            <div class="form-group compact">
                                <label>Cuisine</label>
                                <select id="cuisine" name="cuisine" required>
                                    <option value="Surprise Me">🎲 Surprise Me</option>
                                    <option value="Mediterranean" selected>🫒 Mediterranean</option>
                                    <option value="Asian">🍜 Asian</option>
                                    <option value="Mexican">🌮 Mexican</option>
                                    <option value="Italian">🍝 Italian</option>
                                    <option value="American">🍔 American</option>
                                    <option value="Other Western">🍷 Other Western</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="form-group compact">
                            <label>Allergies (optional)</label>
                            <input type="text" id="allergies" name="allergies" placeholder="e.g., peanuts, shellfish">
                        </div>
                        
                        <div class="form-group compact">
                            <label>Calories</label>
                            <div class="calorie-options compact-options">
                                <div class="calorie-option compact-option">
                                    <input type="radio" id="calorie_auto" name="calorie_preference" value="auto" checked>
                                    <label for="calorie_auto" class="radio-label compact-label">
                                        <span class="option-title">Auto</span>
                                    </label>
                                </div>
                                
                                <div class="calorie-option compact-option">
                                    <input type="radio" id="calorie_custom" name="calorie_preference" value="custom">
                                    <label for="calorie_custom" class="radio-label compact-label">
                                        <span class="option-title">Custom</span>
                                    </label>
                                </div>
                            </div>
                            
                            <div class="form-group compact" id="customCalorieGroup" style="display: none;">
                                <input type="number" id="custom_calories" name="custom_calories" min="400" max="4000" placeholder="Daily calories">
                            </div>
                        </div>
                    </div>
                    
                    <!-- Submit Button -->
                    <button type="submit" class="continue-btn">
                        Continue to Mood Selection →
                    </button>
                    
                    <div class="version-badge">v2.1 • Evidence-Based System</div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/profile.js') }}"></script>
</body>
</html>
