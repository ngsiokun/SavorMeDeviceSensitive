steps:
  # Build User & Nutrition Service
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/savorme-user-nutrition:$COMMIT_SHA', './backend_app/user-nutrition-service']

  # Build Recipe Service  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/savorme-recipe:$COMMIT_SHA', './backend_app/recipe-service']

  # Build Mood & AI Service
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/savorme-mood-ai:$COMMIT_SHA', './backend_app/mood-ai-service']

  # Build API Gateway
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/savorme-router:$COMMIT_SHA', './router']

  # Build Frontend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/savorme-frontend:$COMMIT_SHA', './frontend_app']

  # Push images
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/savorme-user-nutrition:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/savorme-recipe:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/savorme-mood-ai:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/savorme-router:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/savorme-frontend:$COMMIT_SHA']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'savorme-user-nutrition'
      - '--image=gcr.io/$PROJECT_ID/savorme-user-nutrition:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'savorme-recipe'
      - '--image=gcr.io/$PROJECT_ID/savorme-recipe:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'savorme-mood-ai'
      - '--image=gcr.io/$PROJECT_ID/savorme-mood-ai:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'savorme-router'
      - '--image=gcr.io/$PROJECT_ID/savorme-router:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-env-vars=USER_NUTRITION_SERVICE_URL=https://savorme-user-nutrition-$PROJECT_ID-uc.a.run.app,RECIPE_SERVICE_URL=https://savorme-recipe-$PROJECT_ID-uc.a.run.app,MOOD_AI_SERVICE_URL=https://savorme-mood-ai-$PROJECT_ID-uc.a.run.app'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'savorme-frontend'
      - '--image=gcr.io/$PROJECT_ID/savorme-frontend:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-env-vars=BACKEND_URL=https://savorme-router-$PROJECT_ID-uc.a.run.app'

images:
  - 'gcr.io/$PROJECT_ID/savorme-user-nutrition:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/savorme-recipe:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/savorme-mood-ai:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/savorme-router:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/savorme-frontend:$COMMIT_SHA'