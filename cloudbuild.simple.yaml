steps:
  # Build Backend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'Dockerfile.backend', '-t', 'gcr.io/$PROJECT_ID/savorme-backend:$COMMIT_SHA', '.']

  # Build Frontend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'Dockerfile.frontend', '-t', 'gcr.io/$PROJECT_ID/savorme-frontend:$COMMIT_SHA', '.']

  # Push images
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/savorme-backend:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/savorme-frontend:$COMMIT_SHA']

  # Deploy Backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'savorme-backend'
      - '--image=gcr.io/$PROJECT_ID/savorme-backend:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-env-vars=EDAMAM_APP_ID=${_EDAMAM_APP_ID},EDAMAM_APP_KEY=${_EDAMAM_APP_KEY},OPENROUTER_API_KEY=${_OPENROUTER_API_KEY}'

  # Deploy Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'savorme-frontend'
      - '--image=gcr.io/$PROJECT_ID/savorme-frontend:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-env-vars=BACKEND_URL=https://savorme-backend-$PROJECT_ID-uc.a.run.app'

images:
  - 'gcr.io/$PROJECT_ID/savorme-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/savorme-frontend:$COMMIT_SHA'

substitutions:
  _EDAMAM_APP_ID: 'your_edamam_app_id'
  _EDAMAM_APP_KEY: 'your_edamam_app_key'
  _OPENROUTER_API_KEY: 'your_openrouter_api_key'
